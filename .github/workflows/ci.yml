name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + runtime compat)
        run: npm run build

      - name: Smoke tests
        run: npm run test:smoke

      - name: Parity validate
        run: npm run validate

      - name: Core vitest (utils/config/session-id)
        run: npm run test:vitest:core

      - name: Plugin validate (optional)
        run: |
          if command -v grok >/dev/null 2>&1; then
            grok plugin validate .
          else
            echo "grok CLI not available — skip plugin validate"
          fi

  bridge-build:
    name: Bridge esbuild (local artifacts, not committed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript first
        run: npm run build

      - name: Build bridge bundles
        run: npm run build:bridge

      - name: Confirm bridge outputs exist
        run: |
          test -f bridge/mcp-server.cjs
          test -f bridge/cli.cjs
          test -f bridge/runtime-cli.cjs
          test -f bridge/team-mcp.cjs
          ls -lh bridge/*.cjs bridge/team.js
